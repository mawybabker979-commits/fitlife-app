<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">FitLife</div>
        <nav>
            <a href="index.html">تسجيل الدخول</a>
            <a href="exercises.html">التمارين الرياضية</a>
            <a href="nutrition.html">الأغذية</a>
            <a href="contact.html" class="active">تواصل معنا</a>
        </nav>
    </header>

    <div class="container" style="max-width: 600px;">
        <h2>تواصل مع فريق الدعم</h2>
        <form id="contactForm">
            <div class="form-group">
                <label for="name">الاسم:</label>
                <input type="text" id="name" required placeholder="أدخل اسمك الكريم">
            </div>
            <div class="form-group">
                <label for="msgEmail">البريد الإلكتروني:</label>
                <input type="email" id="msgEmail" required placeholder="أدخل بريدك الإلكتروني">
            </div>
            <div class="form-group">
                <label for="message">الرسالة:</label>
                <textarea id="message" rows="5" required placeholder="اكتب استفسارك أو رسالتك هنا..."></textarea>
            </div>
            <button type="submit">إرسال الرسالة</button>
        </form>
        <div id="contactAlert" class="alert alert-success">تم توصيل رسالتك بنجاح! سنتواصل معك قريباً.</div>
    </div>

    <footer>
        جميع الحقوق محفوظة &copy; 2026 تطبيق اللياقة البدنية
    </footer>

    <script src="script.js"></script>
</body>
</html>
