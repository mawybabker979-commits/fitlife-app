<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق اللياقة البدنية - تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">FitLife</div>
        <nav>
            <a href="index.html" class="active">تسجيل الدخول</a>
            <a href="exercises.html">التمارين الرياضية</a>
            <a href="nutrition.html">الأغذية</a>
            <a href="contact.html">تواصل معنا</a>
        </nav>
    </header>

    <div class="container" style="max-width: 450px;">
        <h2>تسجيل الدخول للتطبيق</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">البريد الإلكتروني:</label>
                <input type="email" id="email" required placeholder="أدخل بريدك الإلكتروني">
            </div>
            <div class="form-group">
                <label for="password">كلمة المرور:</label>
                <input type="password" id="password" required placeholder="أدخل كلمة المرور">
            </div>
            <button type="submit">دخول</button>
        </form>
        <div id="loginAlert" class="alert alert-success">تم تسجيل الدخول بنجاح! جاري تحويلك...</div>
    </div>

    <footer>
        جميع الحقوق محفوظة &copy; 2026 تطبيق اللياقة البدنية
    </footer>

    <script src="script.js"></script>
</body>
</html>
